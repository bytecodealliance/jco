[package]
name = "js-component-bindgen"
version = "2.18.0"
license = "Apache-2.0 WITH LLVM-exception"
categories = ["wasm"]
keywords = ["webassembly", "wasm"]
homepage = "https://github.com/bytecodealliance/jco/tree/main/crates/js-component-bindgen"
repository = "https://github.com/bytecodealliance/jco"
authors = [
  "Alex Crichton <alex@alexcrichton.com>",
  "Guy Bedford <gbedford@fastly.com>",
]
description = "JS component bindgen for transpiling WebAssembly components into JavaScript"

edition = { workspace = true }

[lib]
crate-type = ["lib"]

[features]
default = ["transpile-bindgen"]
transpile-bindgen = []
# Expose cooperative-thread names in the public intrinsic API.
coop-threads = []
# Enable selection of an external Component Model runtime provider.
external-runtime = []
# Embed the built-in runtime and eliminate unused JavaScript before returning bindings.
embedded-runtime = [
    "external-runtime",
    "dep:oxc_allocator",
    "dep:oxc_ast",
    "dep:oxc_codegen",
    "dep:oxc_minifier",
    "dep:oxc_parser",
    "dep:oxc_semantic",
    "dep:oxc_span",
    "dep:oxc_str",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true, features = [ "alloc" ] }
bon = { workspace = true, features = [ "std", "alloc" ] }
heck = { workspace = true }
log = { workspace = true }
semver = { workspace = true }
wasm-encoder = { workspace = true, features = [ "wasmparser" ] }
wasm-metadata = { workspace = true }
wasmparser = { workspace = true, features = [ "features", "component-model" ] }
wasmtime-environ = { workspace = true, features = ['component-model'] }
wit-bindgen-core = { workspace = true }
wit-component = { workspace = true }
wit-parser = { workspace = true }

oxc_allocator = { version = "=0.157.0", default-features = false, optional = true }
oxc_ast = { version = "=0.157.0", default-features = false, optional = true }
oxc_codegen = { version = "=0.157.0", default-features = false, optional = true }
oxc_minifier = { version = "=0.157.0", default-features = false, optional = true }
oxc_parser = { version = "=0.157.0", default-features = false, optional = true }
oxc_semantic = { version = "=0.157.0", default-features = false, optional = true }
oxc_span = { version = "=0.157.0", default-features = false, optional = true }
oxc_str = { version = "=0.157.0", default-features = false, optional = true }

[dev-dependencies]
wat = { workspace = true, features = [ "component-model" ] }
