name: embedded-runtime

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Check the runtime embedded in js-component-bindgen
    if: startsWith(github.head_ref, 'prep-release-js-component-bindgen-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - name: Install node modules
        run: pnpm install --frozen-lockfile

      # A crate release may deliberately ship an older runtime, so a stale copy
      # is reported on the release PR rather than failing the check.
      - name: Compare the embedded runtime with the runtime package
        env:
          RESULT_PATH: ${{ runner.temp }}/embedded-runtime/result.json
        run: |
          pnpm --filter '@bytecodealliance/jco-transpile' run check:embedded-runtime --advisory --result "$RESULT_PATH"
      - name: Upload check result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embedded-runtime-result
          path: ${{ runner.temp }}/embedded-runtime
          if-no-files-found: error
          retention-days: 7

  report:
    name: Report the embedded runtime check
    needs: check
    if: ${{ !cancelled() && needs.check.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The comment-writing job executes scripts from the trusted base revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download check result
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: embedded-runtime-result
          path: ${{ runner.temp }}/embedded-runtime
      - name: Summarize the result and update the release PR
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULT_PATH: ${{ runner.temp }}/embedded-runtime/result.json
        run: node scripts/embedded-runtime-report.mjs
