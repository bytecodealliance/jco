name: external-runtime-bench

on:
    workflow_dispatch:
    merge_group:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    benchmark:
        runs-on: ubuntu-22.04
        timeout-minutes: 90
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24.x'

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 11

            - name: Install Rust
              run: rustup update stable --no-self-update

            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  shared-key: jco-${{ hashFiles('Cargo.lock') }}

            - name: Build and compare bundled runtimes
              run: node script/bench-runtime.mjs

            - name: Upload bundled runtime measurements
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: external-runtime-bench
                  path: packages/jco-transpile/bench/output/external-runtime-named
