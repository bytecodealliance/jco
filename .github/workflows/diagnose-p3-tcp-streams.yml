name: diagnose-p3-tcp-streams

on:
    workflow_dispatch:
    push:
        branches:
            - fix/p3-sockets-tcp-streams-timeout

permissions: {}

jobs:
    tcp-streams-node-latest:
        runs-on: ubuntu-22.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: latest

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  version: 11

            - name: Install dependencies
              run: pnpm install

            - name: Build test dependencies
              run: |
                  pnpm --filter '@bytecodealliance/preview3-shim' build
                  pnpm --filter '@bytecodealliance/jco-transpile' build

            - name: Stress p3-sockets-tcp-streams
              working-directory: packages/jco-transpile
              run: |
                  node --version
                  pnpm exec vitest run -c test/vitest.ts test/p3/tcp-streams-stress.ts --maxWorkers 1 --maxConcurrency 4
