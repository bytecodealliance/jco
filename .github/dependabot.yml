version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    cooldown:
      default-days: 14

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/preview2-shim'
      - '/packages/preview3-shim'
      - '/packages/jco-node-fs'
      - '/packages/rolldown-plugin-jco'
      - '/examples/components/*'
    groups:
      example-dependencies:
        update-types:
          - major
          - minor
          - patch
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    cooldown:
      default-days: 14

  - package-ecosystem: "cargo"
    directories:
      # Workspace members inherit dependencies from the root manifest.
      - '/'
      - '/crates/test-components'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    cooldown:
      default-days: 14
