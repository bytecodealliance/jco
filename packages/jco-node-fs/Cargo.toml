[package]
name = "jco-node-fs"
version = "0.3.2"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.0", default-features = false, features = ["napi6"] }
napi-derive = "3.7.0"

cap-fs-ext = "4.0.3"
cap-std = "4.0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.9.0"

[build-dependencies]
napi-build = "2.4.1"
