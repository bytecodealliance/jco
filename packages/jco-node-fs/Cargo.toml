[package]
name = "jco-node-fs"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.2", default-features = false, features = ["napi6"] }
napi-derive = "3.6.3"

[target.'cfg(any(target_os = "android", target_os = "freebsd", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[build-dependencies]
napi-build = "2.4.1"
