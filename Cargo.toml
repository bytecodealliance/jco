[workspace]
resolver = "2"
default-members = [
  "crates/js-component-bindgen",
  "crates/js-component-bindgen-component",
  "crates/wasm-tools-component",
  "crates/xtask",
  "crates/jco-tests",
]
members = [
  "crates/js-component-bindgen",
  "crates/js-component-bindgen-component",
  "crates/wasm-tools-component",
  "crates/xtask",
  "crates/jco-tests",
  "packages/jco-node-fs",
]

[workspace.package]
edition = "2024"
version = "1.10.0"

# Debug builds of the bindgen bundle the runtime on every transpile, which is
# several times slower unless the JavaScript toolchain is optimized.
[profile.dev.package.oxc_allocator]
opt-level = 2

[profile.dev.package.oxc_ast]
opt-level = 2

[profile.dev.package.oxc_ast_visit]
opt-level = 2

[profile.dev.package.oxc_codegen]
opt-level = 2

[profile.dev.package.oxc_data_structures]
opt-level = 2

[profile.dev.package.oxc_ecmascript]
opt-level = 2

[profile.dev.package.oxc_mangler]
opt-level = 2

[profile.dev.package.oxc_minifier]
opt-level = 2

[profile.dev.package.oxc_parser]
opt-level = 2

[profile.dev.package.oxc_semantic]
opt-level = 2

[profile.dev.package.oxc_span]
opt-level = 2

[profile.dev.package.oxc_str]
opt-level = 2

[profile.dev.package.oxc_syntax]
opt-level = 2

[profile.dev.package.oxc_traverse]
opt-level = 2

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 'z'
overflow-checks = false
panic = 'abort'
rpath = false
strip = true

[workspace.dependencies]
anyhow = { version = "1.0.102", default-features = false }
bon = { version = "3.9.1", default-features = false }
base64 = { version = "0.22.1", default-features = false }
cargo_metadata = { version = "0.23.1", default-features = false }
heck = { version = "0.5.0", default-features = false }
log = { version = "0.4.29", default-features = false }
semver = { version = "1.0.27", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
structopt = { version = "0.3.26", default-features = false }
tokio = { version = "1.50.0", default-features = false }
webidl2wit = { version = "0.1.1", default-features = false }
xshell = { version = "0.2.7", default-features = false }

# Wasmtime 50 uses wasmparser 0.261 internally; use its re-export for Wasmtime types.
# The public WIT toolchain must match wit-bindgen-core 0.63 (wasm-tools 0.262).
wasmtime-environ = { version = "50.0.1", features= [ "component-model", "compile", "anyhow" ] }

wasm-encoder = { version = "0.262.0", default-features = false }
wasm-metadata = { version = "0.262.0", default-features = false }
wasmparser = { version = "0.262.0", default-features = false }
wasmprinter = { version = "0.262.0", default-features = false }
wit-encoder = { version = "0.262.0", default-features = false }
wit-component = { version = "0.262.0", features = ["dummy-module"] }
wit-parser = { version = "0.262.0", default-features = false }

wat = { version = "~1.262.0", default-features = false }

wit-bindgen = { version = "0.63.0", default-features = false }
wit-bindgen-core = { version = "0.63.0", default-features = false }

wast = { version = "262.0.0", default-features = false, features = [ "component-model" ] }

js-component-bindgen = { version = "2.19.0", path = "./crates/js-component-bindgen" }
